# cargo-deny configuration. Run from this directory: `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2

[licenses]
allow = ["MIT", "Apache-2.0", "Unicode-3.0"]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Banned: the TLS stacks `ring`, `openssl*` and `native-tls`, and the regular-expression engines (the
# core is a pass over characters). The dev-only RNG crates behind `proptest` (`rand`, `chacha20`) are
# expected; design section 14.1 lists them.
deny = [
    { crate = "ring" },
    { crate = "openssl" },
    { crate = "openssl-sys" },
    { crate = "openssl-src" },
    { crate = "native-tls" },
    { crate = "regex" },
    { crate = "regex-lite" },
    { crate = "regex-automata" },
    { crate = "fancy-regex" },
    { crate = "onig" },
    { crate = "pcre2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
